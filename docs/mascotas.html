<!DOCTYPE html>
<html lang="es">
<head>

<link rel="stylesheet" href="css/estilo_mascota.css">
<title>Gestión de Mascotas</title>
</head>

<body>

<div class="barra-superior">
  <a href="lobby.html" class="btn-regresar">⟵ Regresar al lobby</a>
  <h1>Gestión de Mascotas</h1>
  <div></div>
</div>

<div class="contenedor">
  <div class="lista">
    <h2>Mis Mascotas</h2>

    <div class="mascota-card">
      <h3>Fang</h3>
      <p><b>Tipo:</b> Lobo</p>
      <p><b>Nivel:</b> 3</p>
      <button class="card-btn">⭐ Seleccionar</button>
    </div>

    <div class="mascota-card">
      <h3>Spark</h3>
      <p><b>Tipo:</b> Dragón</p>
      <p><b>Nivel:</b> 5</p>
      <button class="card-btn">⭐ Seleccionar</button>
    </div>

    <button class="btn-agregar">+ Agregar Mascota</button>
  </div>

  <div class="detalle">
    <h2>Selecciona una mascota</h2>
  </div>
</div>

</html>
