<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="img/icons/iconoSF.png">
  <link rel="stylesheet" href="css/estilo_personajes.css">
  <title>Gestión de Personajes</title>
</head>

<body>

<div class="barra-superior">
  <a href="lobby.html" class="btn-regresar">⟵ Regresar al lobby</a>
  <h1>Gestión de Personajes</h1>
  <div></div>
</div>

<div class="contenedor">
  <div class="lista">
    <h2>Mis Personajes</h2>

    <div class="personaje-card">
      <h3>Arthas</h3>
      <p><b>Clase:</b> Guerrero</p>
      <p><b>Nivel:</b> 10</p>

      <button class="card-btn btn-editar">✏️ Editar</button>
      <button class="card-btn btn-eliminar">🗑️ Eliminar</button>
      <button class="card-btn btn-seleccionar">⭐ Seleccionar</button>
    </div>

    <div class="personaje-card">
      <h3>Lumi</h3>
      <p><b>Clase:</b> Mago</p>
      <p><b>Nivel:</b> 7</p>

      <button class="card-btn btn-editar">✏️ Editar</button>
      <button class="card-btn btn-eliminar">🗑️ Eliminar</button>
      <button class="card-btn btn-seleccionar">⭐ Seleccionar</button>
    </div>

    <button class="btn-agregar">+ Agregar Personaje</button>
  </div>

  <div class="detalle">
    <h2>Selecciona un personaje</h2>
    <p>Haz clic sobre un personaje para ver detalles.</p>
  </div>
</div>

</body>
</html>
